<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Rainbow Coloring - Pick a Picture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🌈 Rainbow Coloring</h1>
    <div class="progress-wrap">
      <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
      <span id="progressText" class="progress-text">0 of 18 colored</span>
    </div>
  </header>

  <div id="banner" class="banner"></div>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="foot">Color one picture to unlock the next!</footer>

  <script type="module" src="js/gallery.js"></script>
</body>
</html>
