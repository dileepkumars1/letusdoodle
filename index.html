<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Let Us Doodle - Colour Fun Pictures Online</title>
<meta name="description" content="A free, mobile-friendly colouring book for kids. Colour hand-drawn pictures or design and colour your own!" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Let Us Doodle - Colour Fun Pictures Online" />
<meta property="og:description" content="A free, mobile-friendly colouring book for kids. Colour hand-drawn pictures or design and colour your own!" />
<meta property="og:image" content="assets/og-image.png" />
<meta property="og:url" content="https://letusdoodle.in/" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <span class="topbar-spacer"></span>
      <h1>🌈 Let Us Doodle</h1>
      <button id="musicBtn" class="icon-btn" aria-label="Turn music on">🔈</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
      <span id="progressText" class="progress-text">0 of 18 colored</span>
    </div>
  </header>

  <div id="banner" class="banner"></div>

  <a href="create.html" class="create-cta">
    <span class="create-cta-icon">✨</span>
    <span class="create-cta-text">
      <strong>Create Your Own!</strong>
      <small>Add shapes, draw, and colour a picture you design</small>
    </span>
  </a>

  <section id="creationsSection" class="creations-section" hidden>
    <h2 class="creations-title">My Creations</h2>
    <div id="creationsStrip" class="creations-strip"></div>
  </section>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="foot">Color one picture to unlock the next!</footer>

  <script type="module" src="js/gallery.js"></script>
</body>
</html>
